name: Weekly embeddings and Tier 2 briefing

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  embeddings-and-briefing:
    # Secretos en el entorno «produccion», que solo admite la rama main: una rama
    # (ia/** de Órbita) no puede leerlos aunque cambie este workflow.
    environment: produccion
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      SEO_PRIVATE_URL_KEY: ${{ secrets.SEO_PRIVATE_URL_KEY }}
      # Rol de solo lectura app_funnel_reader (B3). Mientras falte, el paso del embudo se salta.
      APP_FUNNEL_DATABASE_URL: ${{ secrets.APP_FUNNEL_DATABASE_URL }}
      # Bing Webmaster (fase 6). Mientras falte, el paso de Bing se salta.
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      CLOUDFLARE_WORKER_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_AI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_AI_API_TOKEN_2: ${{ secrets.CLOUDFLARE_WORKER_AI_API_TOKEN_2 }}
      CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
      CLOUDFLARE_WORKER_AI_API_TOKEN_3: ${{ secrets.CLOUDFLARE_WORKER_AI_API_TOKEN_3 }}
      CLOUDFLARE_ACCOUNT_ID_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
      CLOUDFLARE_WORKER_AI_API_TOKEN_4: ${{ secrets.CLOUDFLARE_WORKER_AI_API_TOKEN_4 }}
      CLOUDFLARE_ACCOUNT_ID_4: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_4 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - id: generate-embeddings
        run: pnpm generate:embeddings
        continue-on-error: true
      - id: compute-link-suggestions
        run: pnpm compute:link-suggestions
        continue-on-error: true
      - id: crawl-weekly
        run: pnpm crawl:weekly
        continue-on-error: true
      - id: verify-backlinks
        run: pnpm backlinks:verify
        continue-on-error: true
      - id: collect-funnel
        if: env.APP_FUNNEL_DATABASE_URL != ''
        run: pnpm collect:funnel
        continue-on-error: true
      - id: collect-bing
        if: env.BING_WEBMASTER_API_KEY != ''
        run: pnpm collect:bing
        continue-on-error: true
      - id: prioritize
        run: pnpm prioritize
      - id: generate-briefing
        run: pnpm generate:tier2-briefing
      - id: weekly-report
        run: pnpm report:weekly
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: tier2-briefing
          path: tier2-briefing.md
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-report
          path: weekly-report.md
          retention-days: 90
          if-no-files-found: ignore

      # Driven by job.status (not steps.generate-briefing.outcome) so a run
      # always sends exactly one message — even if the job dies before
      # generate-briefing ever runs (e.g. pnpm install/db:generate failing
      # outright). Silence must never be the only signal something broke.
      - name: Build Tier 2 task-count message
        id: tier2-message
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" != "success" ]; then
            echo "text=❌ <b>seo-agent</b>: weekly-embeddings-and-briefing — $STATUS. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          elif [ ! -f tier2-briefing.md ]; then
            echo "text=✅ <b>seo-agent</b>: weekly-embeddings-and-briefing — success (sin tier2-briefing.md). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          elif grep -q "No hay oportunidades Tier 2 abiertas" tier2-briefing.md; then
            echo "text=✅ <b>SEO Agent</b>: sin tareas Tier 2 pendientes esta semana — todo al día." >> "$GITHUB_OUTPUT"
          else
            COUNT=$(grep -oE '^[0-9]+ oportunidades' tier2-briefing.md | head -1 | grep -oE '^[0-9]+')
            echo "text=📋 <b>SEO Agent</b>: ${COUNT:-?} tareas Tier 2 pendientes esta semana. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram (Tier 2 briefing)
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: ${{ steps.tier2-message.outputs.text }}

      - name: Report workflow health
        if: always()
        run: pnpm exec tsx scripts/report-workflow-health.ts "weekly-embeddings-and-briefing" "${{ steps.generate-embeddings.outcome }},${{ steps.compute-link-suggestions.outcome }},${{ steps.crawl-weekly.outcome }},${{ steps.verify-backlinks.outcome }},${{ steps.collect-funnel.outcome }},${{ steps.collect-bing.outcome }},${{ steps.prioritize.outcome }},${{ steps.generate-briefing.outcome }},${{ steps.weekly-report.outcome }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
