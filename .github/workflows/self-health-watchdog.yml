name: self-health watchdog

# Antes vigilaba el cron de wedding-invite-2 (daily-health-checks.yml).
# Se retiró 2026-07-31: wedding-invite-2 no paga GitHub Actions (decisión
# de negocio, no un fallo), así que ese workflow no vuelve a correr nunca
# — vigilarlo solo generaba una alerta diaria falsa-positiva sin acción
# posible, entrenando a ignorar Telegram (fatiga de alertas). Ahora vigila
# el propio daily-collection.yml de este repo: es la señal real que
# importa, porque es el job del que depende todo lo demás (Opportunities,
# fixes de Tier 1, snapshots de Search Console/GA4). Si esto deja de
# correr, sí hay algo que hacer.

on:
  schedule:
    # 09:00 UTC — con el umbral de 26h de isStaleOrFailed, un fallo
    # silencioso (el job de las 06:00 simplemente no se dispara ese día)
    # solo se detecta si, en el momento de esta comprobación, la última
    # ejecución con éxito ya supera las 26h. Comprobar a las 07:30
    # (1h30 tras el job) dejaba la última ejecución en 25h30 — por debajo
    # del umbral, así que un fallo silencioso no se detectaba hasta el día
    # siguiente. A las 09:00, esa misma ejecución ya tiene 27h — por
    # encima del umbral, se detecta el mismo día.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # write: para reactivar los cron (paso siguiente).
      actions: write
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # En repos públicos GitHub desactiva los cron tras 60 días sin commits
      # (estado disabled_inactivity): daily-collection.yml se quedó apagado
      # así desde el 2026-09-29 sin que nada lo volviera a encender. Llamar
      # a "enable" sobre un workflow ya activo reinicia ese contador, así que
      # hacerlo aquí cada día mantiene vivos todos los cron, este incluido.
      - name: Mantener activos los cron del repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[].id'); do
            gh api -X PUT repos/${{ github.repository }}/actions/workflows/$id/enable
          done

      - name: Check daily-collection.yml heartbeat (este mismo repo)
        run: pnpm exec tsx scripts/check-external-workflow-heartbeat.ts ${{ github.repository_owner }} ${{ github.event.repository.name }} daily-collection.yml

      # Ping a healthchecks.io: si ESTE workflow deja de correr,
      # healthchecks.io lo detecta por ausencia de ping y avisa por su
      # cuenta — sin depender de que ningún job de GitHub Actions llegue a
      # ejecutarse. Solo se pinga si el check anterior tuvo éxito.
      - name: Ping healthchecks.io
        if: success()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECKS_PING_URL }}" || true
