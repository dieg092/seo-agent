name: Notify Telegram
description: Send a status message to a Telegram chat via the Bot API
inputs:
  bot-token:
    description: Telegram bot token (secrets.TELEGRAM_BOT_TOKEN)
    required: true
  chat-id:
    description: Telegram chat id (secrets.TELEGRAM_CHAT_ID)
    required: true
  message:
    description: Message text, HTML parse mode
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ -z "${{ inputs.bot-token }}" ] || [ -z "${{ inputs.chat-id }}" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID no configurados como secrets — aviso omitido."
          exit 0
        fi
        http_code=$(curl -sS -o /tmp/telegram-response.json -w "%{http_code}" \
          -X POST "https://api.telegram.org/bot${{ inputs.bot-token }}/sendMessage" \
          --data-urlencode "chat_id=${{ inputs.chat-id }}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "text=${{ inputs.message }}")
        echo "Telegram sendMessage HTTP $http_code"
        if [ "$http_code" != "200" ]; then
          cat /tmp/telegram-response.json
          echo "::warning::No se pudo enviar el aviso de Telegram (HTTP $http_code) — no bloquea el workflow."
        fi
